name: CROUS monitor

on:
  schedule:
    # GitHub's minimum interval; actual firing drifts 5-15 min under load.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json must survive between runs: without it every run would be
      # a "first run" that seeds silently and never alerts.
      - name: Restore state from previous run
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crous-state-${{ github.run_id }}
          restore-keys: |
            crous-state-

      - name: Run monitor
        env:
          ID_TOOL: ${{ vars.ID_TOOL || secrets.ID_TOOL }}
          NOTIFIER: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # "Still alive" Telegram message interval; override with a
          # repository variable (0 disables, 0.084 ≈ every run).
          HEARTBEAT_HOURS: ${{ vars.HEARTBEAT_HOURS || '1' }}
        run: python -m src.main

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crous-state-${{ github.run_id }}
