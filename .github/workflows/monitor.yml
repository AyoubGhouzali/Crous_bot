name: CROUS monitor

on:
  schedule:
    # Hourly trigger (offset from :00 — GitHub skips top-of-the-hour crons
    # the most). Each job then polls every 5 min for ~54 min, because
    # GitHub's scheduler silently skips high-frequency crons like */5:
    # hourly firings are far more reliable than 5-minute ones.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: crous-monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # state.json must survive between jobs: without it every job would
      # start with a "first run" that seeds silently and never alerts.
      # (Within a job, the loop below shares state via the workspace.)
      - name: Restore state from previous run
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: crous-state-${{ github.run_id }}
          restore-keys: |
            crous-state-

      - name: Poll every 5 minutes for ~54 minutes
        env:
          ID_TOOL: ${{ vars.ID_TOOL || secrets.ID_TOOL }}
          NOTIFIER: telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # "Still alive" Telegram message interval; override with a
          # repository variable (0 disables, 0.084 ≈ every cycle).
          HEARTBEAT_HOURS: ${{ vars.HEARTBEAT_HOURS || '1' }}
        run: |
          deadline=$(( SECONDS + 54*60 ))
          failures=0
          cycles=0
          while true; do
            cycles=$(( cycles + 1 ))
            echo "::group::cycle $cycles ($(date -u +%H:%M:%S) UTC)"
            python -m src.main || failures=$(( failures + 1 ))
            echo "::endgroup::"
            [ $(( SECONDS + 300 )) -ge "$deadline" ] && break
            sleep 300
          done
          echo "Cycles: $cycles, failures: $failures"
          # Only fail the job if not a single cycle worked.
          [ "$failures" -lt "$cycles" ]

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: crous-state-${{ github.run_id }}
